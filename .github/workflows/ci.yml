name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krit_test
          POSTGRES_PASSWORD: krit_test
          POSTGRES_DB: krit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krit_test -d krit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QT_QPA_PLATFORM: offscreen
      KRIT_TEST_POSTGRES_URL: postgresql+asyncpg://krit_test:krit_test@127.0.0.1:5432/krit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./bot[dev]" -e "./management[dev]" ruff asyncpg
      - name: Ruff
        run: ruff check bot/src bot/tests management/src management/tests
      - name: Compile
        run: python -m compileall -q bot/src management/src
      - name: Server and migration tests
        run: pytest bot/tests -q
      - name: Management tests
        run: pytest management/tests -q
