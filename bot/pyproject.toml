[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krit-max-bot"
version = "1.3.0"
description = "MAX notification bot for KRiT education center"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.3,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "truststore>=0.10,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "websockets>=15,<17",
]

[project.scripts]
krit-bot = "krit_bot.main:run"
krit-migrate = "krit_bot.migrate:run"

[tool.hatch.build.targets.wheel]
packages = ["src/krit_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
